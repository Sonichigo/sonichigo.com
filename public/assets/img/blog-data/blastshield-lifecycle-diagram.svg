<svg viewBox="0 0 920 260" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe Print','Comic Sans MS',cursive">
  <defs>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" result="noise" seed="7"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#343a40"/>
    </marker>
  </defs>

  <rect x="20" y="90" width="190" height="86" rx="10" fill="#fff3bf" stroke="#343a40" stroke-width="2.2" filter="url(#rough)"/>
  <text x="115" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#343a40">db_estimate_</text>
  <text x="115" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#343a40">blast_radius</text>
  <text x="115" y="158" text-anchor="middle" font-size="10" fill="#495057">read-only. never executes.</text>

  <line x1="210" y1="133" x2="248" y2="133" stroke="#343a40" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#rough)"/>

  <rect x="248" y="90" width="190" height="86" rx="10" fill="#a5d8ff" stroke="#343a40" stroke-width="2.2" filter="url(#rough)"/>
  <text x="343" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#343a40">db_dry_run</text>
  <text x="343" y="142" text-anchor="middle" font-size="10" fill="#495057">rehearses the change,</text>
  <text x="343" y="156" text-anchor="middle" font-size="10" fill="#495057">issues a signed ticket</text>

  <line x1="438" y1="133" x2="476" y2="133" stroke="#343a40" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#rough)"/>

  <rect x="476" y="90" width="210" height="86" rx="10" fill="#ffd8a8" stroke="#343a40" stroke-width="2.2" filter="url(#rough)"/>
  <text x="581" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#343a40">db_apply</text>
  <text x="581" y="140" text-anchor="middle" font-size="10" fill="#495057">requires ticket, re-analyzes,</text>
  <text x="581" y="154" text-anchor="middle" font-size="10" fill="#495057">snapshots, executes</text>

  <line x1="686" y1="133" x2="724" y2="133" stroke="#343a40" stroke-width="2.2" marker-end="url(#arrow)" filter="url(#rough)"/>

  <rect x="724" y="90" width="176" height="86" rx="10" fill="#b2f2bb" stroke="#343a40" stroke-width="2.2" filter="url(#rough)"/>
  <text x="812" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#343a40">db_rollback</text>
  <text x="812" y="142" text-anchor="middle" font-size="10" fill="#495057">restores from snapshot,</text>
  <text x="812" y="156" text-anchor="middle" font-size="10" fill="#495057">by change_id</text>

  <text x="460" y="230" text-anchor="middle" font-size="12" fill="#868e96" font-style="italic">no bypass tool. every write goes through all four steps.</text>
</svg>
